workflows:
  ios-release:
    name: DrycleanPlus iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic # Name of App Store Connect integration in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.drycleanplus.service.uk.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
      - name: Publish to App Store Connect
        script: |
          IPA_PATH=$(find . -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          app-store-connect publish --path "$IPA_PATH"
    artifacts:
      - build/**/*.ipa
      - ios/**/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
